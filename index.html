<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control Assistència">
    <meta name="theme-color" content="#075e54">
    <title>Control d'Assistència QR</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 100%);
            color: white; min-height: 100vh; display: flex; flex-direction: column;
        }
        header { padding: 20px; text-align: center; background: rgba(0,0,0,0.2); }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; background: black; position: relative; overflow: hidden; border-radius: 0 0 15px 15px; }
        .scanner-container { position: relative; flex-shrink: 0; }
        .laser { height: 2px; background: red; position: absolute; width: 100%; z-index: 10; top: 0;
            animation: scan 2s linear infinite; box-shadow: 0 0 8px red; display: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .stats-bar { display: flex; justify-content: space-around; padding: 15px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .stat-card { text-align: center; flex: 1; }
        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.8; }

        #lista-estudiantes { flex-grow: 1; overflow-y: auto; padding: 10px; background: rgba(255,255,255,0.05); }
        .estudiante-card {
            background: white; color: #333; padding: 12px; border-radius: 8px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .estudiante-info div:first-child { font-weight: bold; color: #1a2a6c; }
        .estudiante-info div:last-child { font-size: 12px; color: #666; }

        .controls { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button {
            padding: 15px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-scan { background: #4CAF50; color: white; grid-column: span 2; }
        .btn-export { background: #25D366; color: white; }
        .btn-clear { background: #ff4444; color: white; }

        /* URL config panel */
        .config-panel {
            margin: 0 10px 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 12px;
        }
        .config-panel label {
            font-size: 11px;
            opacity: 0.8;
            display: block;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .config-panel input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 20px;
            font-family: Arial, sans-serif;
            letter-spacing: 0.1em;
            text-align: center;
        }
        .config-panel input::placeholder { color: rgba(255,255,255,0.3); font-size: 14px; letter-spacing: 0.05em; }
        .url-preview {
            margin-top: 6px;
            font-family: monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            word-break: break-all;
            min-height: 14px;
        }
        .url-preview span { color: #4CAF50; font-weight: bold; }
        .btn-test {
            margin-top: 8px;
            width: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 25px; border-radius: 25px; z-index: 1000; display: none;
            animation: fadeInOut 3s ease-in-out; max-width: 90%; text-align: center;
        }
        @keyframes fadeInOut { 0%, 100% { opacity: 0; } 10%, 90% { opacity: 1; } }

        .pending-badge {
            display: none;
            background: #ff9800;
            color: #000;
            font-size: 11px;
            font-weight: bold;
            border-radius: 20px;
            padding: 2px 8px;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Control d'Assistència</h1>
        <div style="font-size:12px; opacity:0.7; margin-top:4px;">▸ Google Sheets</div>
    </header>

    <!-- Google Apps Script URL Config -->
    <div class="config-panel">
        <label>🔑 Codi d'accés (4 caràcters)</label>
        <input type="text" id="script-url" placeholder="_ _ _ _" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
        <div class="url-preview" id="url-preview"></div>
        <button class="btn-test" onclick="testConnection()">🔌 Provar connexió</button>
    </div>

    <div class="scanner-container">
        <div id="reader"></div>
        <div id="laser" class="laser"></div>
    </div>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-value" id="count">0</div>
            <div class="stat-label">Total Escanejats</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="connection-status">🔄</div>
            <div class="stat-label">
                Estat Google Sheets
                <span class="pending-badge" id="pending-badge"></span>
            </div>
        </div>
    </div>

    <div id="lista-estudiantes"></div>

    <div class="controls">
        <button id="btn-toggle" class="btn-scan" onclick="toggleScanner()">
            <span>📷</span> Iniciar Escàner
        </button>
        <button class="btn-export" onclick="compartir()">
            <span>📤</span> Compartir Resum
        </button>
        <button class="btn-clear" onclick="confirmarNeteja()">
            <span>🗑️</span> Netejar Llista
        </button>
    </div>

    <div style="margin: 0 10px 10px; text-align: center;">
        <button onclick="reintentarPendents()"
                style="background: rgba(255,165,0,0.2); color: #ffd080; border: 1px solid rgba(255,165,0,0.3);
                       padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold;
                       width: 100%; max-width: 300px;">
          🔁 Reintentar registres pendents
        </button>
    </div>

    <div style="margin: 0 10px 20px; padding: 10px; text-align: center;">
        <button onclick="generarHashSeguretat()"
                style="background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255,255,255,0.2);
                       padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold;
                       width: 100%; max-width: 300px;">
          🛡️ VERIFICACIÓ D'INTEGRITAT (S1)
        </button>
        <div id="hash-display"
             style="margin-top: 6px; font-family: monospace; font-size: 10px; word-break: break-all; color: #4CAF50;
                    background: rgba(0,0,0,0.5); padding: 4px; border-radius: 4px; min-height: 12px;"></div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        // ─── CONFIG ──────────────────────────────────────────────────────────────
        const URL_BASE   = 'https://script.google.com/macros/s/AKfycbznzcFBuBrHAqFJwuRB8lwqs_vsJVtJhL4Y0ycvANB5A6zqUvXgLppjgB1z6iHrUK';
        const URL_SUFFIX = '/exec';

        const urlInput   = document.getElementById('script-url');
        const urlPreview = document.getElementById('url-preview');

        // Restore saved suffix
        urlInput.value = localStorage.getItem('scriptSuffix') || '';
        updatePreview();

        urlInput.addEventListener('input', () => {
            // Allow only alphanumeric chars, auto-uppercase
            urlInput.value = urlInput.value.replace(/[^a-zA-Z0-9]/g, '');
            localStorage.setItem('scriptSuffix', urlInput.value);
            updatePreview();
        });

        function updatePreview() {
            const suffix = urlInput.value.trim();
            if (suffix.length === 4) {
                urlPreview.innerHTML = URL_BASE + '<span>' + suffix + '</span>' + URL_SUFFIX;
            } else if (suffix.length > 0) {
                urlPreview.innerHTML = '<span style="color:#ff9800">' + (4 - suffix.length) + ' caràcter(s) restants…</span>';
            } else {
                urlPreview.innerHTML = '';
            }
        }

        function getScriptUrl() {
            const suffix = (urlInput.value.trim() || localStorage.getItem('scriptSuffix') || '');
            if (suffix.length !== 4) return '';
            return URL_BASE + suffix + URL_SUFFIX;
        }

        // ─── STATE ───────────────────────────────────────────────────────────────
        let estudiantes  = [];
        let pendingQueue = [];   // failed records queued for retry
        let html5QrCode;
        let isScanning = false;
        let responsableNom = localStorage.getItem('responsableNom') || '';

        // ─── NOTIFICATIONS ───────────────────────────────────────────────────────
        function mostrarNotificacion(msj, color) {
            const n = document.getElementById('notification');
            n.innerText = msj;
            n.style.backgroundColor = color;
            n.style.display = 'block';
            clearTimeout(n._t);
            n._t = setTimeout(() => n.style.display = 'none', 3000);
        }

        function actualitzarEstatConnexio(estat) {
            const el    = document.getElementById('connection-status');
            const badge = document.getElementById('pending-badge');
            if      (estat === 'ok')      el.innerText = '✅';
            else if (estat === 'pendent') el.innerText = '⏳';
            else                          el.innerText = '❌';

            if (pendingQueue.length > 0) {
                badge.style.display = 'inline';
                badge.innerText = pendingQueue.length + ' pend.';
            } else {
                badge.style.display = 'none';
            }
        }

        // ─── IDENTITY ────────────────────────────────────────────────────────────
        async function verificarIdentitat() {
            if (!responsableNom) {
                const nom = prompt('👤 Introdueix el teu nom de responsable:');
                if (!nom || nom.trim().length < 2) {
                    alert('❌ Has d\'introduir un nom vàlid.');
                    location.reload();
                    return;
                }
                responsableNom = nom.trim();
                localStorage.setItem('responsableNom', responsableNom);
            }
            mostrarNotificacion(`✅ Benvingut/da, ${responsableNom}`, '#4CAF50');
            if (getScriptUrl()) await testConnection(true);
            else actualitzarEstatConnexio('error');
        }

        // ─── CONNECTION TEST ─────────────────────────────────────────────────────
        // Apps Script deployed as "anyone" web app accepts GET requests.
        // We use no-cors so the browser won't block it; we can't read the response
        // body but a resolve (no throw) means the network request succeeded.
        async function testConnection(silent = false) {
            const url = getScriptUrl();
            if (!url) {
                if (!silent) alert('⚠️ Introdueix primer el codi de 4 caràcters.');
                actualitzarEstatConnexio('error');
                return false;
            }
            actualitzarEstatConnexio('pendent');
            try {
                await Promise.race([
                    fetch(`${url}?test=true`, { method: 'GET', mode: 'no-cors' }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 5000))
                ]);
                actualitzarEstatConnexio('ok');
                if (!silent) mostrarNotificacion('✅ Connexió correcta!', '#4CAF50');
                return true;
            } catch (err) {
                actualitzarEstatConnexio('error');
                if (!silent) mostrarNotificacion('❌ Error de connexió: ' + err.message, '#f44336');
                return false;
            }
        }

        // ─── SEND TO GOOGLE SHEETS ───────────────────────────────────────────────
        // The Apps Script doGet() reads e.parameter, so a GET request with query
        // params is the simplest, most compatible approach (no CORS preflight needed).
        async function enviarAlServidor(dades) {
            const url = getScriptUrl();
            if (!url) {
                pendingQueue.push(dades);
                actualitzarEstatConnexio('error');
                mostrarNotificacion('⚠️ Codi no configurat. Registre en cua.', '#ff9800');
                return;
            }
        
            actualitzarEstatConnexio('pendent');
        
            const params = new URLSearchParams({
                id:          dades.id,
                fecha:       dades.fecha,
                hora:        dades.hora,
                responsable: dades.responsable
            });
        
            try {
                const res = await Promise.race([
                    fetch(`${url}?${params.toString()}`),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 5000))
                ]);
                // Apps Script returns plain text "Success" or an error string
                const text = await res.text();
                if (!text.includes('Success')) throw new Error(text);
                actualitzarEstatConnexio('ok');
                mostrarNotificacion('✅ Registrat a Google Sheets', '#4CAF50');
            } catch (err) {
                pendingQueue.push(dades);
                actualitzarEstatConnexio('error');
                mostrarNotificacion('❌ Error: ' + err.message, '#f44336');
            }
        }

        // ─── RETRY PENDING QUEUE ─────────────────────────────────────────────────
        async function reintentarPendents() {
            if (pendingQueue.length === 0) {
                mostrarNotificacion('ℹ️ No hi ha registres pendents.', '#2196F3');
                return;
            }
            const n = pendingQueue.length;
            mostrarNotificacion(`🔁 Reintentant ${n} registre(s)...`, '#ff9800');
            const queue = [...pendingQueue];
            pendingQueue = [];
            actualitzarEstatConnexio('pendent');
            for (const dades of queue) {
                await enviarAlServidor(dades);
                await new Promise(r => setTimeout(r, 500));
            }
        }

        // ─── QR SCAN SUCCESS ─────────────────────────────────────────────────────
        function onScanSuccess(decodedText) {
            if (estudiantes.some(e => e.id === decodedText)) {
                mostrarNotificacion('🔁 Ja escanejat aquesta sessió', '#ff9800');
                return;
            }

            const ara = new Date();
            const nouEstudiant = {
                fecha:       ara.toLocaleDateString('ca-ES'),
                hora:        ara.toLocaleTimeString('ca-ES'),
                id:          decodedText,
                responsable: responsableNom
            };

            estudiantes.unshift(nouEstudiant);
            actualizarLista();
            if (navigator.vibrate) navigator.vibrate(100);
            enviarAlServidor(nouEstudiant);
        }

        function actualizarLista() {
            document.getElementById('count').innerText = estudiantes.length;
            const lista = document.getElementById('lista-estudiantes');
            lista.innerHTML = estudiantes.map(e => `
                <div class="estudiante-card">
                    <div class="estudiante-info">
                        <div>ID: ${e.id}</div>
                        <div>${e.fecha} · ${e.hora} · <em>${e.responsable}</em></div>
                    </div>
                    <div>✅</div>
                </div>
            `).join('');
        }

        // ─── SCANNER TOGGLE ──────────────────────────────────────────────────────
        async function toggleScanner() {
            const btn   = document.getElementById('btn-toggle');
            const laser = document.getElementById('laser');
            if (!isScanning) {
                if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
                try {
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 250 } },
                        onScanSuccess
                    );
                    isScanning = true;
                    btn.innerHTML = "<span>🛑</span> Aturar";
                    btn.style.background = "#ff4444";
                    laser.style.display = "block";
                } catch (err) { alert("Error càmera: " + err); }
            } else {
                await html5QrCode.stop();
                isScanning = false;
                btn.innerHTML = "<span>📷</span> Iniciar Escàner";
                btn.style.background = "#4CAF50";
                laser.style.display = "none";
            }
        }

        // ─── SHARE ───────────────────────────────────────────────────────────────
        function compartir() {
            if (estudiantes.length === 0) {
                mostrarNotificacion('⚠️ La llista està buida', '#ff9800');
                return;
            }
            const ara    = new Date();
            const dia    = String(ara.getDate()).padStart(2, '0');
            const mes    = String(ara.getMonth() + 1).padStart(2, '0');
            const any    = ara.getFullYear();
            const hores  = String(ara.getHours()).padStart(2, '0');
            const minuts = String(ara.getMinutes()).padStart(2, '0');
            const nomId  = responsableNom ? responsableNom.toLowerCase().replace(/\s+/g, '_') : 'sense_nom';
            const nomArxiu = `${nomId}_${dia}-${mes}-${any}_${hores}-${minuts}.txt`;

            let contingut = `DATA\tHORA\tID\tRESPONSABLE\n`;
            estudiantes.forEach(e => {
                contingut += `${e.fecha}\t${e.hora}\t${e.id}\t${e.responsable}\n`;
            });
            const resum = `📋 Assistència: ${estudiantes.length} total.`;

            if (navigator.share && navigator.canShare) {
                const arxiu = new File([contingut], nomArxiu, { type: 'text/plain' });
                if (navigator.canShare({ files: [arxiu] })) {
                    navigator.share({ title: "Assistència", text: resum, files: [arxiu] })
                             .catch(() => compartirWhatsApp(resum, contingut));
                } else { compartirWhatsApp(resum, contingut); }
            } else { compartirWhatsApp(resum, contingut); }
        }

        function compartirWhatsApp(resum, contingut) {
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(resum + '\n\n' + contingut)}`);
        }

        // ─── CLEAR ───────────────────────────────────────────────────────────────
        function confirmarNeteja() {
            if (confirm("Vols buidar la llista local?")) {
                estudiantes = [];
                actualizarLista();
            }
        }

        // ─── INTEGRITY HASH ──────────────────────────────────────────────────────
        async function generarHashSeguretat() {
            try {
                const urlNeta = window.location.href.split('#')[0].split('?')[0] + '?t=' + Date.now();
                const response = await fetch(urlNeta);
                const text = await response.text();
                const encoder = new TextEncoder();
                const data = encoder.encode(text);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                document.getElementById('hash-display').innerText = hashHex;
                await navigator.clipboard.writeText(hashHex);
                alert("Codi FIX copiat: " + hashHex.substring(0, 8));
            } catch (err) { console.error(err); }
        }

        // ─── INIT ────────────────────────────────────────────────────────────────
        window.addEventListener('load', verificarIdentitat);
    </script>
</body>
</html>
